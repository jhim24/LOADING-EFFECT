<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fight Intro Animation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
}

/* Background Glow */

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle,#222 0%,#000 80%);
}

/* Main */

.container{
    text-align:center;
    position:relative;
}

/* YOU */

.you{
    font-size:70px;
    color:#00ffff;
    font-weight:bold;
    opacity:0;
    transform:translateX(-900px);
    animation:youMove 1.2s forwards;
    text-shadow:0 0 20px cyan;
}

/* ARE */

.are{
    font-size:40px;
    color:white;
    margin:15px 0;
    opacity:0;
    animation:show 0.4s forwards;
    animation-delay:1s;
}

/* INVITED */

.invited{
    font-size:90px;
    color:#ffcc00;
    font-weight:bold;
    opacity:0;
    transform:translateX(900px);
    animation:inviteMove 1.2s forwards;
    animation-delay:1.1s;
    text-shadow:
    0 0 15px yellow,
    0 0 40px orange;
}

/* Impact */

.flash{

position:absolute;

top:50%;

left:50%;

width:20px;

height:20px;

border-radius:50%;

background:white;

transform:translate(-50%,-50%);

opacity:0;

animation:flash 0.5s;

animation-delay:2.1s;

}

/* Shake */

.container{

animation:shake .3s;

animation-delay:2.1s;

}

/* Animations */

@keyframes youMove{

100%{

opacity:1;

transform:translateX(0);

}

}

@keyframes inviteMove{

100%{

opacity:1;

transform:translateX(0);

}

}

@keyframes show{

100%{

opacity:1;

}

}

@keyframes flash{

0%{

opacity:1;

transform:translate(-50%,-50%) scale(.2);

}

100%{

opacity:0;

transform:translate(-50%,-50%) scale(20);

}

}

@keyframes shake{

0%{transform:translate(4px,0);}
25%{transform:translate(-4px,0);}
50%{transform:translate(4px,0);}
75%{transform:translate(-4px,0);}
100%{transform:translate(0,0);}

}

</style>

</head>

<body>

<div class="container">

<div class="flash"></div>

<div class="you">
YOU
</div>

<div class="are">
ARE
</div>

<div class="invited">
INVITED
</div>

</div>

</body>
</html>
