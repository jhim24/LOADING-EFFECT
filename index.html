<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microchip Loading</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#070b14;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

.loader{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ==========================
   CHIP
========================== */

.chip{
    width:260px;
    height:170px;
    background:linear-gradient(145deg,#242b38,#111722);
    border:3px solid #3b4455;
    border-radius:18px;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    box-shadow:
        0 0 40px rgba(0,255,255,.15),
        inset 0 0 25px rgba(255,255,255,.06);
}

.chip h1{
    color:white;
    font-size:32px;
    letter-spacing:3px;
}

.chip p{
    color:#7cf7ff;
    margin-top:10px;
    letter-spacing:5px;
}

/* ==========================
   CHIP PINS
========================== */

.pin{
    position:absolute;
    width:12px;
    height:18px;
    background:#8b93a5;
    border-radius:3px;
}

.t1{top:-18px;left:35px;}
.t2{top:-18px;left:75px;}
.t3{top:-18px;left:115px;}
.t4{top:-18px;left:155px;}
.t5{top:-18px;left:195px;}

.b1{bottom:-18px;left:35px;}
.b2{bottom:-18px;left:75px;}
.b3{bottom:-18px;left:115px;}
.b4{bottom:-18px;left:155px;}
.b5{bottom:-18px;left:195px;}

.l1{left:-18px;top:30px;}
.l2{left:-18px;top:60px;}
.l3{left:-18px;top:90px;}
.l4{left:-18px;top:120px;}

.r1{right:-18px;top:30px;}
.r2{right:-18px;top:60px;}
.r3{right:-18px;top:90px;}
.r4{right:-18px;top:120px;}

/* ==========================
   CIRCUIT LINES
========================== */

.line{
    position:absolute;
    height:4px;
    background:#263246;
    overflow:hidden;
}

.left1{
    width:260px;
    left:-260px;
    top:50px;
}

.left2{
    width:260px;
    left:-260px;
    top:85px;
}

.left3{
    width:260px;
    left:-260px;
    top:120px;
}

.right1{
    width:260px;
    right:-260px;
    top:50px;
}

.right2{
    width:260px;
    right:-260px;
    top:85px;
}

.right3{
    width:260px;
    right:-260px;
    top:120px;
}

/* ==========================
   RUNNING LIGHTS
========================== */

.light{
    position:absolute;
    width:60px;
    height:100%;
    border-radius:20px;
}
    /* =========================================
   RUNNING LIGHT COLORS
========================================= */

.left1 .light{
    background:linear-gradient(90deg,transparent,#00e5ff,#ffffff,#00e5ff,transparent);
    animation:runLeft 2s linear infinite;
}

.left2 .light{
    background:linear-gradient(90deg,transparent,#ff00ff,#ffffff,#ff00ff,transparent);
    animation:runLeft 2.5s linear infinite;
}

.left3 .light{
    background:linear-gradient(90deg,transparent,#00ff66,#ffffff,#00ff66,transparent);
    animation:runLeft 1.8s linear infinite;
}

.right1 .light{
    background:linear-gradient(90deg,transparent,#ffcc00,#ffffff,#ffcc00,transparent);
    animation:runRight 2.2s linear infinite;
}

.right2 .light{
    background:linear-gradient(90deg,transparent,#ff3333,#ffffff,#ff3333,transparent);
    animation:runRight 1.9s linear infinite;
}

.right3 .light{
    background:linear-gradient(90deg,transparent,#00bfff,#ffffff,#00bfff,transparent);
    animation:runRight 2.6s linear infinite;
}

/* Glow */

.light{
    box-shadow:
        0 0 10px currentColor,
        0 0 20px currentColor,
        0 0 35px currentColor;
}

/* =========================================
   ANIMATION
========================================= */

@keyframes runLeft{

    from{
        left:-60px;
    }

    to{
        left:260px;
    }

}

@keyframes runRight{

    from{
        right:-60px;
    }

    to{
        right:260px;
    }

}

/* =========================================
   CHIP GLOW
========================================= */

.chip::before{

content:"";

position:absolute;

inset:-4px;

border-radius:20px;

background:linear-gradient(
45deg,
#00e5ff,
#00ff88,
#ffcc00,
#ff0066,
#8a2be2,
#00e5ff
);

background-size:400%;

z-index:-1;

filter:blur(12px);

animation:borderGlow 6s linear infinite;

}

@keyframes borderGlow{

0%{background-position:0% 50%;}

100%{background-position:400% 50%;}

}
    </style>

</head>

<body>

<div class="loader">

    <div class="chip">

        <!-- TOP PINS -->
        <div class="pin t1"></div>
        <div class="pin t2"></div>
        <div class="pin t3"></div>
        <div class="pin t4"></div>
        <div class="pin t5"></div>

        <!-- BOTTOM PINS -->
        <div class="pin b1"></div>
        <div class="pin b2"></div>
        <div class="pin b3"></div>
        <div class="pin b4"></div>
        <div class="pin b5"></div>

        <!-- LEFT PINS -->
        <div class="pin l1"></div>
        <div class="pin l2"></div>
        <div class="pin l3"></div>
        <div class="pin l4"></div>

        <!-- RIGHT PINS -->
        <div class="pin r1"></div>
        <div class="pin r2"></div>
        <div class="pin r3"></div>
        <div class="pin r4"></div>

        <!-- LEFT LINES -->
        <div class="line left1">
            <div class="light"></div>
        </div>

        <div class="line left2">
            <div class="light"></div>
        </div>

        <div class="line left3">
            <div class="light"></div>
        </div>

        <!-- RIGHT LINES -->
        <div class="line right1">
            <div class="light"></div>
        </div>

        <div class="line right2">
            <div class="light"></div>
        </div>

        <div class="line right3">
            <div class="light"></div>
        </div>

        <h1>CPU</h1>
        <p>LOADING...</p>

    </div>

</div>

<script>

// Demo lamang.
// Dito tayo maglalagay ng loading logic sa susunod.

console.log("Microchip Loader Ready!");

</script>

</body>
</html>
