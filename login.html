<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Birthday Login</title>

<meta name="theme-color"
content="#C8102E">

<link rel="stylesheet"
href="login.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div id="stars"></div>

<div id="particles"></div>

<div id="balloons"></div>

<div class="login-wrapper">

<div class="login-card">

<div class="logo">

<i class="fa-solid fa-gift"></i>

</div>

<h1>

Birthday Surprise

</h1>

<h2>

Ryan Cortez Manebog

</h2>

<p>

Enter Password

</p>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input

type="password"

id="loginPassword"

placeholder="Password"

autocomplete="off"

autocorrect="off"

autocapitalize="off"

spellcheck="false"

inputmode="text"

>

</div>

<button id="loginBtn">

UNLOCK SURPRISE

</button>

<p id="loginMessage"></p>

</div>

</div>

<div id="loadingScreen"></div>

<div id="countdownScreen"></div>

<div id="giftScreen"></div>

<script src="login.js"></script>

</body>

</html>
