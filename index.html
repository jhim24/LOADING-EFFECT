<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Ryan</title>

<!-- CSS -->
<link rel="stylesheet" href="style.css">

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- =========================
BACKGROUND
========================= -->

<div id="background"></div>

<!-- Confetti -->
<div id="confetti"></div>

<!-- Floating Balloons -->
<div id="balloons">

    <div class="balloon red"></div>

    <div class="balloon blue"></div>

    <div class="balloon yellow"></div>

    <div class="balloon green"></div>

    <div class="balloon purple"></div>

</div>
<!-- Floating Balloons -->

<div id="balloons">

    <div class="balloon red"></div>

    <div class="balloon blue"></div>

    <div class="balloon yellow"></div>

    <div class="balloon green"></div>

    <div class="balloon purple"></div>

</div>
<!-- =========================
MAIN CONTAINER
========================= -->

<div class="container">

    <!-- Header -->

    <header>

        <div class="logo">

            <i class="fa-solid fa-cake-candles"></i>

            Happy Birthday

        </div>

    </header>

    <!-- Hero -->

    <section class="hero">

        <h3>A Special Celebration</h3>

        <h1>

            RYAN

            <br>

            CORTEZ MANEBOG

        </h1>

        <p>

            Wishing you happiness,

            good health,

            success,

            and God's abundant blessings.

        </p>

        <button id="celebrate">

            <i class="fa-solid fa-gift"></i>

            Celebrate

        </button>

    </section>

    <!-- Icons -->

    <section class="icons">

        <div>

            <i class="fa-solid fa-cake-candles"></i>

            Cake

        </div>

        <div>

            <i class="fa-solid fa-gift"></i>

            Gift

        </div>

        <div>

            <i class="fa-solid fa-heart"></i>

            Love

        </div>

        <div>

            <i class="fa-solid fa-star"></i>

            Wishes

        </div>

    </section>

</div>
<!-- =====================================
BIRTHDAY POPUP
===================================== -->

<div id="birthdayPopup">

    <div class="popup-card">

        <i class="fa-solid fa-cake-candles"></i>

        <h1>HAPPY BIRTHDAY</h1>

        <h2>RYAN CORTEZ MANEBOG</h2>

        <p>

            Wishing you endless happiness,

            good health,

            success,

            and God's abundant blessings.

        </p>

        <button id="closePopup">

            Close

        </button>

    </div>

</div>

<!-- Canvas for Fireworks -->
<canvas id="fireworksCanvas"></canvas>
    
<!-- JavaScript -->

<script src="script.js"></script>

</body>

</html>
