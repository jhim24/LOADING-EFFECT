<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chips Loading Effect</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#111827;
    font-family:Arial,sans-serif;
}

.loader{
    display:flex;
    gap:10px;
}

.chip{
    width:16px;
    height:60px;
    border-radius:20px;
    background:#333;
    animation:chipLoad 1s infinite ease-in-out;
}

.chip:nth-child(1){animation-delay:0s;}
.chip:nth-child(2){animation-delay:0.1s;}
.chip:nth-child(3){animation-delay:0.2s;}
.chip:nth-child(4){animation-delay:0.3s;}
.chip:nth-child(5){animation-delay:0.4s;}
.chip:nth-child(6){animation-delay:0.5s;}
.chip:nth-child(7){animation-delay:0.6s;}
.chip:nth-child(8){animation-delay:0.7s;}

@keyframes chipLoad{
    0%,100%{
        transform:scaleY(1);
        background:#333;
        box-shadow:none;
    }

    50%{
        transform:scaleY(1.6);
        background:#ffcc00;
        box-shadow:0 0 20px #ffcc00;
    }
}
</style>

</head>
<body>

<div class="loader">
    <div class="chip"></div>
    <div class="chip"></div>
    <div class="chip"></div>
    <div class="chip"></div>
    <div class="chip"></div>
    <div class="chip"></div>
    <div class="chip"></div>
    <div class="chip"></div>
</div>

</body>
</html>
