<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOZADA Hacker Effect</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#00ff66;
    font-family:Consolas, monospace;
    overflow:hidden;
}

/* Background Glow */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at center,
    rgba(0,255,100,.08),
    transparent 70%);
}

/* Terminal */

.terminal{

    width:90%;
    max-width:900px;

    margin:40px auto;

    border:2px solid #00ff66;

    padding:20px;

    box-shadow:0 0 25px #00ff66;

    background:rgba(0,20,0,.85);

    height:80vh;

    overflow:hidden;

}

.title{

    font-size:24px;

    margin-bottom:20px;

    color:#00ff99;

}

.line{

    margin:10px 0;

    white-space:nowrap;

    overflow:hidden;

    border-right:2px solid #00ff66;

    animation:blink .8s infinite;

}

@keyframes blink{

50%{

border-color:transparent;

}

}

/* Progress */

.progress{

margin-top:25px;

width:100%;

height:18px;

background:#022;

border:1px solid #00ff66;

}

.bar{

height:100%;

width:0%;

background:#00ff66;

animation:load 8s linear forwards;

}

@keyframes load{

100%{

width:100%;

}

}

/* Footer */

.status{

margin-top:20px;

font-size:20px;

color:#00ff66;

animation:flash 1s infinite;

}

@keyframes flash{

50%{

opacity:.4;

}

}

</style>

</head>

<body>

<div class="terminal">

<div class="title">
LOZADA SECURITY TERMINAL
</div>

<div id="output"></div>

<div class="progress">

<div class="bar"></div>

</div>

<div class="status" id="status">
Initializing...
</div>

</div>

<script>

const lines=[

"> Connecting to Secure Server...",

"> Loading Employee Database...",

"> Checking Firewall...",

"> Decrypting Files...",

"> Loading Payroll Module...",

"> Loading Attendance Module...",

"> Verifying User Access...",

"> Access Granted."

];

const output=document.getElementById("output");

let i=0;

function printLine(){

if(i<lines.length){

let div=document.createElement("div");

div.className="line";

div.innerHTML=lines[i];

output.appendChild(div);

i++;

setTimeout(printLine,900);

}else{

document.getElementById("status").innerHTML="SYSTEM READY ✔";

}

}

printLine();

</script>

</body>
</html>
