<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOZADA ERP - Boot Screen</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#00ff66;
    font-family:Consolas,monospace;
    overflow:hidden;
}

/* Grid Background */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    linear-gradient(rgba(0,255,100,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,100,.05) 1px,transparent 1px);
    background-size:40px 40px;
}

/* Terminal */

#terminal{
    width:90%;
    max-width:1000px;
    height:90vh;
    margin:25px auto;
    border:2px solid #00ff66;
    background:#021002;
    box-shadow:0 0 25px #00ff66;
    padding:20px;
    overflow:hidden;
}

#title{
    font-size:28px;
    color:#00ffaa;
    margin-bottom:20px;
}

#output{
    line-height:1.8;
    font-size:18px;
}

.cursor{
    animation:blink .8s infinite;
}

@keyframes blink{

50%{

opacity:0;

}

}

/* Progress */

.progress{

margin-top:30px;

height:20px;

background:#022;

border:1px solid #00ff66;

}

.bar{

height:100%;

width:0;

background:linear-gradient(90deg,#00ff66,#00ffaa);

transition:.5s;

}

/* Final Logo */

#logo{

display:none;

text-align:center;

margin-top:40px;

animation:zoom 1s;

}

#logo h1{

font-size:65px;

letter-spacing:8px;

color:#fff;

text-shadow:0 0 20px #00ff66;

}

#logo h2{

font-size:22px;

margin-top:15px;

color:#00ffaa;

}

@keyframes zoom{

from{

transform:scale(.3);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}

</style>

</head>

<body>

<div id="terminal">

<div id="title">
LOZADA ERP SECURITY TERMINAL
</div>

<div id="output"></div>

<div class="progress">

<div class="bar" id="bar"></div>

</div>

<div id="logo">

<h1>LOZADA ERP</h1>

<h2>SYSTEM READY ✔</h2>

</div>

</div>

<script>

const logs=[

"> Booting System...",

"> Initializing Kernel...",

"> Loading Core Engine...",

"> Loading Employee Module...",

"> Loading Payroll Module...",

"> Loading Attendance Module...",

"> Loading Inventory Module...",

"> Loading Accounting Module...",

"> Loading Reports Module...",

"> Loading Settings Module...",

"> Connecting Firebase...",

"> Connection Successful.",

"> Synchronizing Database...",

"> Checking User Permission...",

"> Loading Security Keys...",

"> Encrypting Session...",

"> Verifying System License...",

"> Security Check Passed.",

"> Starting Dashboard Services...",

"> System Ready."

];

let i=0;

const output=document.getElementById("output");

const bar=document.getElementById("bar");

function typeLine(){

if(i<logs.length){

const div=document.createElement("div");

div.innerHTML=logs[i]+" <span class='cursor'>█</span>";

output.appendChild(div);

output.scrollTop=output.scrollHeight;

bar.style.width=((i+1)/logs.length*100)+"%";

i++;

setTimeout(typeLine,450);

}else{

setTimeout(showLogo,800);

}

}

function showLogo(){

document.getElementById("logo").style.display="block";

}

typeLine();

</script>

</body>
</html>
